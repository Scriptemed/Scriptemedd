<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Cyton Gamma 300 — IBVS Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root {
    --bg-1:#0a0f24; --bg-2:#101736; --panel:#121a33; --panel-2:#0f1730;
    --border:#22305c; --border-soft:#1a2347;
    --text:#e7eaf6; --text-soft:#9aa3c0;
    --accent:#3da9fc; --accent-2:#7c5cff;
    --danger:#ef4565; --good:#4ade80; --warn:#fbbf24;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif;color:var(--text);
    background:radial-gradient(1100px 600px at 15% -10%,#1a2552 0%,#0a0f24 60%) fixed,
               radial-gradient(900px 500px at 110% 110%,#2a1c5a 0%,#0a0f24 60%) fixed,
               #0a0f24;
    overflow:hidden;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 22px;background:rgba(10,15,35,.85);
    border-bottom:1px solid var(--border);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:10;height:60px;
  }
  header .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.1rem;letter-spacing:.01em}
  header .brand i{color:var(--accent);font-size:1.4rem}
  header .brand small{display:block;font-size:.7rem;font-weight:500;color:var(--text-soft);letter-spacing:.05em}
  header .status{
    display:flex;align-items:center;gap:8px;padding:6px 12px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:20px;font-size:.82rem;font-weight:500;
  }
  header .status .dot{width:8px;height:8px;border-radius:50%;background:#666;transition:.2s}
  header .status.active .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
  header .status.converged .dot{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  header .status.snap .dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}

  main{
    display:grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 1fr auto;
    gap:12px;padding:12px;
    height:calc(100vh - 60px);
  }
  .scene-panel{
    grid-row:1;grid-column:1;
    background:linear-gradient(180deg,#0e1530,#0a1024);
    border:1px solid var(--border);border-radius:14px;
    overflow:hidden;position:relative;min-height:0;
  }
  .scene-panel #mainCanvas{display:block;width:100%;height:100%}
  .scene-panel .scene-tag{
    position:absolute;top:12px;left:14px;display:flex;gap:8px;align-items:center;
    font-size:.75rem;color:var(--text-soft);background:rgba(0,0,0,.35);
    padding:5px 10px;border-radius:14px;border:1px solid var(--border-soft);
    pointer-events:none;
  }
  .scene-panel .scene-tag i{color:var(--accent)}

  .side-panel{
    grid-row:1;grid-column:2;
    display:flex;flex-direction:column;gap:12px;
    overflow-y:auto;min-height:0;padding-right:2px;
  }
  .side-panel::-webkit-scrollbar{width:6px}
  .side-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .frame{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);border-radius:12px;padding:12px;
  }
  .frame h3{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--text-soft);margin-bottom:8px;
    display:flex;align-items:center;justify-content:space-between;font-weight:700;
  }
  .frame h3 .sub{font-size:.65rem;color:var(--text-soft);font-weight:500;opacity:.8}
  .frame canvas.view{
    width:100%;aspect-ratio:4/3;background:#000;border-radius:8px;display:block;
    border:1px solid var(--border-soft);
  }
  .frame canvas.chart{
    width:100%;height:120px;display:block;background:rgba(0,0,0,.2);
    border-radius:8px;border:1px solid var(--border-soft);
  }
  .upload-row{margin-top:8px;display:flex;gap:8px}
  .upload-row label{
    flex:1;padding:7px 10px;background:rgba(61,169,252,.12);
    border:1px solid var(--accent);border-radius:8px;cursor:pointer;
    text-align:center;font-size:.78rem;color:var(--accent);font-weight:600;
    transition:.15s;display:flex;gap:6px;align-items:center;justify-content:center;
  }
  .upload-row label:hover{background:rgba(61,169,252,.22)}
  .upload-row input[type=file]{display:none}

  .similarity-bar{margin-top:10px;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
  .similarity-bar .fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#ef4565,#fbbf24 50%,#4ade80);
    transition:width .15s;
  }
  .similarity-text{
    display:flex;justify-content:space-between;font-size:.75rem;margin-top:6px;
    color:var(--text-soft);font-weight:500;
  }
  .similarity-text b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:500}

  .controls{
    grid-row:2;grid-column:1 / span 2;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);border-radius:12px;padding:14px;
    display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:stretch;
  }
  .actions{display:flex;flex-direction:column;gap:8px}
  .btn{
    padding:10px 14px;border:none;border-radius:9px;cursor:pointer;
    font-weight:600;font-size:.85rem;font-family:inherit;
    transition:transform .15s,box-shadow .15s,opacity .15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg,#3da9fc,#1e6bd6);color:#fff}
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(61,169,252,.35)}
  .btn-danger{background:linear-gradient(135deg,#ef4565,#b8253f);color:#fff}
  .btn-danger:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(239,69,101,.35)}
  .btn-warn{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1a1a}
  .btn-warn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(251,191,36,.3)}
  .btn-secondary{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text)}
  .btn-secondary:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

  .joints{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;
    align-content:start;
  }
  .joint{
    background:rgba(255,255,255,.025);border:1px solid var(--border);
    border-radius:9px;padding:8px 10px;
  }
  .joint .row{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin-bottom:4px}
  .joint .name{font-weight:700;color:var(--accent);letter-spacing:.04em}
  .joint .val{font-family:'JetBrains Mono',monospace;color:var(--text-soft);font-size:.72rem}
  .joint input[type=range]{
    width:100%;accent-color:var(--accent);height:18px;
  }
  .joint.locked{opacity:.6;pointer-events:none}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(10,15,35,.95);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:24px;font-size:.85rem;font-weight:500;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    display:flex;align-items:center;gap:10px;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.good{border-color:var(--good)}
  .toast.warn{border-color:var(--warn)}
  .toast i{color:var(--accent)}
  .toast.good i{color:var(--good)}
  .toast.warn i{color:var(--warn)}

  @media(max-width:1100px){
    main{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;overflow-y:auto}
    .scene-panel{height:55vh}
    .side-panel{grid-column:1;grid-row:2}
    .controls{grid-row:3;grid-column:1;grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <i class="fas fa-robot"></i>
    <div>
      Cyton Gamma 300 — IBVS Simulation
      <small>7-DOF Image-Based Visual Servoing</small>
    </div>
  </div>
  <div class="status" id="statusBadge"><span class="dot"></span><span id="statusText">Idle</span></div>
</header>

<main>
  <div class="scene-panel">
    <div class="scene-tag"><i class="fas fa-cube"></i> 3D Workcell View</div>
    <canvas id="mainCanvas"></canvas>
  </div>

  <aside class="side-panel">
    <div class="frame">
      <h3>Desired Image <span class="sub">target on the table</span></h3>
      <canvas id="desiredCanvas" class="view" width="320" height="240"></canvas>
      <div class="upload-row">
        <label for="imageUpload"><i class="fas fa-upload"></i> Upload Desired Image</label>
        <input id="imageUpload" type="file" accept="image/*" />
      </div>
    </div>

    <div class="frame">
      <h3>Current Image <span class="sub">live camera view</span></h3>
      <canvas id="currentCanvas" class="view" width="320" height="240"></canvas>
    </div>

    <div class="frame">
      <h3>Image Error <span class="sub" id="iterText">it 0</span></h3>
      <canvas id="errorChart" class="chart"></canvas>
      <div class="similarity-bar"><div class="fill" id="simFill"></div></div>
      <div class="similarity-text">
        <span>Similarity</span>
        <b id="simText">0.0%</b>
      </div>
    </div>
  </aside>

  <div class="controls">
    <div class="actions">
      <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> Start IBVS Simulation</button>
      <button class="btn btn-danger"  id="stopBtn"  disabled><i class="fas fa-stop"></i> Stop</button>
      <button class="btn btn-warn"    id="snapBtn"><i class="fas fa-camera"></i> Snap to Desired Pose</button>
      <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-rotate-left"></i> Reset Joints</button>
    </div>
    <div class="joints" id="jointsContainer"></div>
  </div>
</main>

<div class="toast" id="toast"><i class="fas fa-info-circle"></i><span id="toastText"></span></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
/* ============================================================
   Cyton Gamma 300 — IBVS Simulation
   Combines: 3D realistic robot, per-joint controls, uploadable
   desired image on table, live current camera view, live error
   graph, Start IBVS, Snap-to-desired-pose, 98% auto-stop.
   ============================================================ */

const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));

/* -------------- DOM refs -------------- */
const mainCanvas    = document.getElementById('mainCanvas');
const desiredCanvas = document.getElementById('desiredCanvas');
const currentCanvas = document.getElementById('currentCanvas');
const errorChartEl  = document.getElementById('errorChart');
const simFill       = document.getElementById('simFill');
const simText       = document.getElementById('simText');
const iterText      = document.getElementById('iterText');
const statusBadge   = document.getElementById('statusBadge');
const statusText    = document.getElementById('statusText');
const startBtn      = document.getElementById('startBtn');
const stopBtn       = document.getElementById('stopBtn');
const snapBtn       = document.getElementById('snapBtn');
const resetBtn      = document.getElementById('resetBtn');
const jointsContainer = document.getElementById('jointsContainer');
const imageUpload   = document.getElementById('imageUpload');
const toastEl       = document.getElementById('toast');
const toastText     = document.getElementById('toastText');

function setStatus(text, kind=''){
  statusText.textContent = text;
  statusBadge.className = 'status' + (kind ? ' '+kind : '');
}
let toastTimer=null;
function toast(msg, kind=''){
  toastText.textContent = msg;
  toastEl.className = 'toast '+kind+' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'),2400);
}

/* -------------- Default desired image -------------- */
function drawDefaultDesired(canvas){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#fef3c7'); g.addColorStop(1,'#fde68a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=20){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=20){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // shapes
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(80,80,38,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#22c55e'; ctx.fillRect(200,40,80,80);
  ctx.fillStyle='#3b82f6';
  ctx.beginPath(); ctx.moveTo(160,140); ctx.lineTo(120,210); ctx.lineTo(200,210); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1e293b'; ctx.font='bold 22px Inter, sans-serif';
  ctx.textAlign='center'; ctx.fillText('TARGET', 160, 235);
}

drawDefaultDesired(desiredCanvas);

/* ============================================================
   THREE.JS scene
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f24);
scene.fog = new THREE.Fog(0x0a0f24, 6, 16);

const renderer = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const mainCamera = new THREE.PerspectiveCamera(45, 1, 0.05, 50);
mainCamera.position.set(2.0, 1.55, 2.4);
mainCamera.lookAt(0.6, 0.7, 0);

/* lights */
const hemi = new THREE.HemisphereLight(0xa8c5ff, 0x0e1735, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.position.set(3, 5.5, 2); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
const sc = key.shadow.camera; sc.left=-3; sc.right=3; sc.top=3; sc.bottom=-3; sc.near=0.5; sc.far=12;
scene.add(key);
const fill = new THREE.DirectionalLight(0x90a8ff, 0.35);
fill.position.set(-2,3,-2); scene.add(fill);

/* floor */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.MeshStandardMaterial({ color:0x141a2e, roughness:.92, metalness:.04 })
);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.GridHelper(20, 40, 0x2a3563, 0x1a2347));

/* table */
function makeTable(){
  const g = new THREE.Group();
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.05, 0.7),
    new THREE.MeshStandardMaterial({ color:0x4a5878, roughness:.55, metalness:.15 })
  );
  top.position.y = 0.7; top.castShadow = true; top.receiveShadow = true; g.add(top);
  const legMat = new THREE.MeshStandardMaterial({ color:0x2a3553, roughness:.7, metalness:.1 });
  for (const [x,z] of [[-.45,-.3],[.45,-.3],[-.45,.3],[.45,.3]]) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05,.7,.05), legMat);
    leg.position.set(x, 0.35, z); leg.castShadow = true; g.add(leg);
  }
  return g;
}
const table = makeTable();
table.position.set(1.4, 0, 0);
scene.add(table);

/* ============================================================
   Image plane on the table (desired image as texture)
   ============================================================ */
const PLANE_W = 0.6, PLANE_H = 0.45;
const IMG_CENTER = new THREE.Vector3(1.4, 0.96, 0);
// Plane geometry default normal is +Z.
// Rotate -π/2 around Y -> normal becomes (-1,0,0) (toward robot).
const imgPlaneTex = new THREE.CanvasTexture(desiredCanvas);
imgPlaneTex.colorSpace = THREE.SRGBColorSpace;
imgPlaneTex.minFilter = THREE.LinearFilter;
imgPlaneTex.magFilter = THREE.LinearFilter;
const imgPlaneMat = new THREE.MeshBasicMaterial({ map: imgPlaneTex, side: THREE.DoubleSide });
const imgPlane = new THREE.Mesh(new THREE.PlaneGeometry(PLANE_W, PLANE_H), imgPlaneMat);
imgPlane.position.copy(IMG_CENTER);
imgPlane.rotation.y = -Math.PI/2;
scene.add(imgPlane);

/* picture frame around the image */
const frameMat = new THREE.MeshStandardMaterial({ color:0x1a1d24, roughness:.4, metalness:.5 });
const pictureFrame = new THREE.Mesh(
  new THREE.BoxGeometry(0.025, PLANE_H+0.06, PLANE_W+0.06),
  frameMat
);
pictureFrame.position.set(IMG_CENTER.x + 0.014, IMG_CENTER.y, IMG_CENTER.z);
pictureFrame.castShadow = true; pictureFrame.receiveShadow = true;
scene.add(pictureFrame);

/* small base to hold the frame upright */
const standMat = new THREE.MeshStandardMaterial({ color:0x232838, roughness:.6, metalness:.2 });
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.025, PLANE_W*0.55), standMat);
stand.position.set(IMG_CENTER.x + 0.02, 0.7 + 0.025 + 0.0125, 0);
stand.castShadow = true; scene.add(stand);

/* ============================================================
   Cyton Gamma 300 — kinematic chain
   J1 Y, J2 Z, J3 Y, J4 Z, J5 Y, J6 Z, J7 Y
   ============================================================ */
function buildRobot(){
  const root = new THREE.Group();

  const matBody  = new THREE.MeshStandardMaterial({ color:0x1a1d28, roughness:.45, metalness:.55 });
  const matLink  = new THREE.MeshStandardMaterial({ color:0x2b3140, roughness:.5,  metalness:.45 });
  const matAcc   = new THREE.MeshStandardMaterial({ color:0xd9381e, roughness:.35, metalness:.35,
                          emissive:0x3a0d05, emissiveIntensity:.5 });
  const matDark  = new THREE.MeshStandardMaterial({ color:0x0e1118, roughness:.55, metalness:.4 });
  const matLens  = new THREE.MeshStandardMaterial({ color:0x4488dd, roughness:.18, metalness:.85,
                          emissive:0x103355, emissiveIntensity:.4 });

  // pedestal
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.18,0.05,28), matDark);
  pedestal.position.y = 0.025; pedestal.castShadow = true; pedestal.receiveShadow = true; root.add(pedestal);

  const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.14,0.16,28), matBody);
  baseMesh.position.y = 0.13; baseMesh.castShadow = true; root.add(baseMesh);

  // ---- J1 (yaw, around Y) ----
  const j1 = new THREE.Group();
  j1.position.y = 0.21;
  root.add(j1);

  const shoulderRing = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.04,24), matAcc);
  shoulderRing.position.y = 0.02; shoulderRing.castShadow = true; j1.add(shoulderRing);
  const shoulderHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.10,24), matBody);
  shoulderHousing.position.y = 0.09; shoulderHousing.castShadow = true; j1.add(shoulderHousing);

  // ---- J2 (pitch, around Z) ----
  const j2 = new THREE.Group();
  j2.position.y = 0.14;
  j1.add(j2);

  const j2Bar = new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.052,0.18,18), matAcc);
  j2Bar.rotation.x = Math.PI/2; j2Bar.castShadow = true; j2.add(j2Bar);

  const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.34, 0.085), matLink);
  upperArm.position.y = 0.05 + 0.17; upperArm.castShadow = true; j2.add(upperArm);
  // top end ring of upper arm
  const upperTop = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.06,18), matAcc);
  upperTop.position.y = 0.05 + 0.34 + 0.03; upperTop.castShadow = true; j2.add(upperTop);

  // ---- J3 (roll, around Y) ----
  const j3 = new THREE.Group();
  j3.position.y = 0.45;
  j2.add(j3);

  const j3Body = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.08,18), matBody);
  j3Body.position.y = 0.04; j3Body.castShadow = true; j3.add(j3Body);

  // ---- J4 (elbow, around Z) ----
  const j4 = new THREE.Group();
  j4.position.y = 0.08;
  j3.add(j4);

  const j4Bar = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.16,18), matAcc);
  j4Bar.rotation.x = Math.PI/2; j4Bar.castShadow = true; j4.add(j4Bar);

  const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.28, 0.075), matLink);
  forearm.position.y = 0.04 + 0.14; forearm.castShadow = true; j4.add(forearm);

  const forearmTop = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.05,18), matAcc);
  forearmTop.position.y = 0.04 + 0.28 + 0.025; forearmTop.castShadow = true; j4.add(forearmTop);

  // ---- J5 (wrist roll, around Y) ----
  const j5 = new THREE.Group();
  j5.position.y = 0.36;
  j4.add(j5);
  const j5Body = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.06,18), matBody);
  j5Body.position.y = 0.03; j5Body.castShadow = true; j5.add(j5Body);

  // ---- J6 (wrist pitch, around Z) ----
  const j6 = new THREE.Group();
  j6.position.y = 0.06;
  j5.add(j6);
  const j6Bar = new THREE.Mesh(new THREE.CylinderGeometry(0.038,0.038,0.10,18), matAcc);
  j6Bar.rotation.x = Math.PI/2; j6Bar.castShadow = true; j6.add(j6Bar);

  // ---- J7 (gripper roll, around Y) ----
  const j7 = new THREE.Group();
  j7.position.y = 0.04;
  j6.add(j7);
  const gripperBox = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.06, 0.075), matBody);
  gripperBox.position.y = 0.03; gripperBox.castShadow = true; j7.add(gripperBox);

  // camera housing + lens (sits on the gripper)
  const camBox = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, 0.07), matDark);
  camBox.position.set(0, 0.06, 0.035); j7.add(camBox);
  const lensRing = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.012,18), matBody);
  lensRing.rotation.x = Math.PI/2; lensRing.position.set(0, 0.06, 0.072); j7.add(lensRing);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,0.012,18), matLens);
  lens.rotation.x = Math.PI/2; lens.position.set(0, 0.06, 0.078); j7.add(lens);

  // EE mount (camera-frame attachment)
  const eeMount = new THREE.Group();
  eeMount.position.set(0, 0.06, 0.078);
  j7.add(eeMount);

  // joint metadata: each joint rotates about its named local axis.
  const joints = [
    { name:'J1 (Base Yaw)',     group:j1, axis:'y', min:-Math.PI,        max: Math.PI,        home: 0 },
    { name:'J2 (Shoulder)',     group:j2, axis:'z', min:-Math.PI*0.85,   max: Math.PI*0.85,   home:-1.05 },
    { name:'J3 (Upper Roll)',   group:j3, axis:'y', min:-Math.PI,        max: Math.PI,        home: 0 },
    { name:'J4 (Elbow)',        group:j4, axis:'z', min:-Math.PI*0.85,   max: Math.PI*0.85,   home: 1.20 },
    { name:'J5 (Forearm Roll)', group:j5, axis:'y', min:-Math.PI,        max: Math.PI,        home: 0 },
    { name:'J6 (Wrist Pitch)',  group:j6, axis:'z', min:-Math.PI*0.7,    max: Math.PI*0.7,    home: 0.40 },
    { name:'J7 (Gripper Roll)', group:j7, axis:'y', min:-Math.PI,        max: Math.PI,        home: 0 },
  ];
  joints.forEach(j => { j.value = j.home; j.group.rotation[j.axis] = j.home; });

  return { root, eeMount, joints };
}

const robot = buildRobot();
robot.root.position.set(0,0,0);
scene.add(robot.root);

/* End-effector camera — child of eeMount, looking along eeMount's +Z */
const eeCamera = new THREE.PerspectiveCamera(45, 4/3, 0.02, 30);
robot.eeMount.add(eeCamera);
eeCamera.rotation.set(0, Math.PI, 0); // flip 180° so its forward (-Z) points along eeMount's +Z

/* tiny visual frustum cone for the EE camera (in main view only) */
const frustGeo = new THREE.ConeGeometry(0.025, 0.06, 12, 1, true);
const frustMat = new THREE.MeshBasicMaterial({ color:0x3da9fc, transparent:true, opacity:.25, wireframe:true });
const frustum = new THREE.Mesh(frustGeo, frustMat);
frustum.rotation.x = Math.PI/2; frustum.position.z = 0.04; robot.eeMount.add(frustum);

/* ============================================================
   Camera-view renderer (live "current image" frame)
   preserveDrawingBuffer:true so we can sample its pixels for similarity.
   ============================================================ */
const camRenderer = new THREE.WebGLRenderer({
  canvas: currentCanvas, antialias:true, preserveDrawingBuffer:true
});
camRenderer.setPixelRatio(1);
camRenderer.setSize(currentCanvas.width, currentCanvas.height, false);
camRenderer.shadowMap.enabled = false;

/* ============================================================
   Forward kinematics & IK
   ============================================================ */

/* Desired camera pose (in front of the image plane, looking at its center) */
const FOV = 45;
// distance so that PLANE_H exactly fills the vertical FOV:
//   PLANE_H/2 = D * tan(FOV/2)  =>  D = PLANE_H / (2 tan(FOV/2))
const D_DESIRED = (PLANE_H/2) / Math.tan(FOV/2 * Math.PI/180);
const IMG_NORMAL_TOWARD_ROBOT = new THREE.Vector3(-1,0,0);
const desiredCamPos  = IMG_CENTER.clone().add(IMG_NORMAL_TOWARD_ROBOT.clone().multiplyScalar(D_DESIRED));
const desiredFwd     = IMG_NORMAL_TOWARD_ROBOT.clone().negate(); // (1,0,0) toward image
const desiredUp      = new THREE.Vector3(0,1,0);

function quatFromForwardUp(fwd, up){
  const z = fwd.clone().negate().normalize();        // camera +Z (since cam looks -Z)
  const x = new THREE.Vector3().crossVectors(up, z).normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  const m = new THREE.Matrix4().makeBasis(x, y, z);
  return new THREE.Quaternion().setFromRotationMatrix(m);
}
const desiredQuat = quatFromForwardUp(desiredFwd, desiredUp);

function setJoint(i, v){
  const j = robot.joints[i];
  v = clamp(v, j.min, j.max);
  j.value = v;
  j.group.rotation[j.axis] = v;
}
function getJointValues(){ return robot.joints.map(j=>j.value); }
function setJointValues(qs){ qs.forEach((v,i)=>setJoint(i,v)); }

const _tmpPos  = new THREE.Vector3();
const _tmpQuat = new THREE.Quaternion();
const _tmpScl  = new THREE.Vector3();

function getCameraPose(){
  robot.root.updateMatrixWorld(true);
  eeCamera.matrixWorld.decompose(_tmpPos, _tmpQuat, _tmpScl);
  return { pos: _tmpPos.clone(), quat: _tmpQuat.clone() };
}

/* 6D pose error: [posErr_xyz, rotErr_xyz] (rotErr from axis-angle of qDes * qCur^-1) */
function poseError(curPos, curQuat, desPos, desQuat){
  const p = desPos.clone().sub(curPos);
  const qE = desQuat.clone().multiply(curQuat.clone().invert()).normalize();
  let w = clamp(qE.w, -1, 1);
  const s = Math.sqrt(Math.max(0, 1 - w*w));
  let angle = 2 * Math.atan2(s, w);
  if (angle > Math.PI) angle -= 2*Math.PI;
  let ax=0, ay=0, az=0;
  if (s > 1e-8){
    const k = angle / s;
    ax = qE.x * k; ay = qE.y * k; az = qE.z * k;
  }
  return [p.x, p.y, p.z, ax, ay, az];
}

/* Numerical 6×7 Jacobian of camera pose wrt joint angles */
function computeJacobian(){
  const dq = 1e-3;
  const J = [new Array(7),new Array(7),new Array(7),new Array(7),new Array(7),new Array(7)];
  const q0 = getJointValues();
  const p0 = getCameraPose();
  for (let i=0;i<7;i++){
    setJoint(i, q0[i] + dq);
    const p1 = getCameraPose();
    const dP = p1.pos.clone().sub(p0.pos).divideScalar(dq);
    const dQ = p1.quat.clone().multiply(p0.quat.clone().invert()).normalize();
    let w = clamp(dQ.w, -1, 1);
    const s = Math.sqrt(Math.max(0, 1 - w*w));
    let angle = 2 * Math.atan2(s, w);
    if (angle > Math.PI) angle -= 2*Math.PI;
    let ax=0, ay=0, az=0;
    if (s > 1e-8){
      const k = (angle/dq) / s;
      ax = dQ.x * k; ay = dQ.y * k; az = dQ.z * k;
    }
    J[0][i] = dP.x; J[1][i] = dP.y; J[2][i] = dP.z;
    J[3][i] = ax;   J[4][i] = ay;   J[5][i] = az;
    setJoint(i, q0[i]);
  }
  return J;
}

/* one IK step (Jacobian-transpose with damping & clamp) */
function ikStep(desPos, desQuat, alpha=0.6, maxStep=0.06){
  const cur = getCameraPose();
  const e = poseError(cur.pos, cur.quat, desPos, desQuat);
  const J = computeJacobian();
  const dq = new Array(7).fill(0);
  for (let i=0;i<7;i++){
    let s = 0;
    for (let r=0;r<6;r++) s += J[r][i] * e[r];
    dq[i] = clamp(alpha * s, -maxStep, maxStep);
  }
  const q0 = getJointValues();
  for (let i=0;i<7;i++) setJoint(i, q0[i] + dq[i]);
  return Math.hypot(...e);
}

/* ============================================================
   Similarity (downsampled per-pixel mean abs grayscale diff)
   ============================================================ */
const CMP = 64;
const cmpCanvas = document.createElement('canvas');
cmpCanvas.width = CMP; cmpCanvas.height = CMP;
const cmpCtx = cmpCanvas.getContext('2d', { willReadFrequently:true });

function computeGray(srcCanvas){
  cmpCtx.clearRect(0,0,CMP,CMP);
  cmpCtx.drawImage(srcCanvas, 0, 0, CMP, CMP);
  const d = cmpCtx.getImageData(0,0,CMP,CMP).data;
  const out = new Uint8Array(CMP*CMP);
  for (let p=0,i=0;p<CMP*CMP;p++,i+=4){
    out[p] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
  }
  return out;
}
let desiredGray = null;
function refreshDesiredGray(){
  desiredGray = computeGray(desiredCanvas);
}

function similarity(){
  if (!desiredGray) return 0;
  const cur = computeGray(currentCanvas);
  let s = 0;
  for (let p=0;p<cur.length;p++) s += Math.abs(cur[p] - desiredGray[p]);
  const mad = s / cur.length / 255;
  return Math.max(0, 1 - mad);
}

/* ============================================================
   Error chart (Chart.js)
   ============================================================ */
const chart = new Chart(errorChartEl.getContext('2d'), {
  type:'line',
  data:{
    labels: [],
    datasets:[{
      label:'1 - similarity',
      data:[],
      borderColor:'#ef4565',
      backgroundColor:'rgba(239,69,101,.18)',
      fill:true, tension:.28, pointRadius:0, borderWidth:2
    }]
  },
  options:{
    responsive:true, maintainAspectRatio:false, animation:false,
    scales:{
      x:{ display:false },
      y:{ min:0, max:1, ticks:{ color:'#9aa3c0', font:{size:10} },
          grid:{ color:'rgba(255,255,255,.05)' } }
    },
    plugins:{ legend:{ display:false } }
  }
});
const MAX_PTS = 240;
function pushError(v){
  chart.data.labels.push('');
  chart.data.datasets[0].data.push(v);
  if (chart.data.labels.length > MAX_PTS){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  chart.update('none');
}
function resetChart(){
  chart.data.labels.length = 0;
  chart.data.datasets[0].data.length = 0;
  chart.update('none');
}

/* ============================================================
   Joint sliders UI
   ============================================================ */
const sliders = [];
function buildJointUI(){
  jointsContainer.innerHTML = '';
  robot.joints.forEach((j,i)=>{
    const div = document.createElement('div');
    div.className = 'joint';
    div.innerHTML = `
      <div class="row">
        <span class="name">${j.name}</span>
        <span class="val" id="jv${i}">${j.value.toFixed(2)} rad</span>
      </div>
      <input type="range" min="${j.min}" max="${j.max}" step="0.01" value="${j.value}" id="js${i}"/>
    `;
    jointsContainer.appendChild(div);
    const slider = div.querySelector('input');
    const val = div.querySelector('.val');
    slider.addEventListener('input', ()=>{
      const v = parseFloat(slider.value);
      setJoint(i, v);
      val.textContent = v.toFixed(2)+' rad';
    });
    sliders.push({ slider, val, wrapper:div });
  });
}
function syncSlidersFromRobot(){
  robot.joints.forEach((j,i)=>{
    sliders[i].slider.value = j.value;
    sliders[i].val.textContent = j.value.toFixed(2)+' rad';
  });
}
function lockSliders(locked){
  sliders.forEach(s => s.wrapper.classList.toggle('locked', locked));
}
buildJointUI();

/* ============================================================
   Image upload
   ============================================================ */
imageUpload.addEventListener('change', e=>{
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    const c = desiredCanvas, ctx = c.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,c.width,c.height);
    const r = Math.min(c.width/img.width, c.height/img.height);
    const w = img.width*r, h = img.height*r;
    ctx.drawImage(img, (c.width-w)/2, (c.height-h)/2, w, h);
    imgPlaneTex.needsUpdate = true;
    refreshDesiredGray();
    resetChart();
    URL.revokeObjectURL(url);
    toast('Desired image updated', 'good');
  };
  img.src = url;
});

/* ============================================================
   Modes & main loop
   ============================================================ */
let mode = 'idle';            // 'idle' | 'ibvs' | 'snap' | 'converged'
let iter = 0;
const STOP_THRESH = 0.98;     // user-spec: stop when current image == desired at >= 98%

function startIBVS(){
  if (mode === 'ibvs') return;
  mode = 'ibvs';
  iter = 0;
  resetChart();
  setStatus('IBVS Running', 'active');
  startBtn.disabled = true;
  stopBtn.disabled  = false;
  snapBtn.disabled  = true;
  resetBtn.disabled = true;
  lockSliders(true);
}
function stopIBVS(reason='stopped'){
  if (mode !== 'ibvs') return;
  mode = 'idle';
  setStatus(reason, '');
  startBtn.disabled = false;
  stopBtn.disabled  = true;
  snapBtn.disabled  = false;
  resetBtn.disabled = false;
  lockSliders(false);
}

function snapToDesired(){
  if (mode === 'ibvs') return;
  // synchronous IK to find target joint configuration
  const startQ = getJointValues();
  for (let it=0; it<250; it++){
    const eMag = ikStep(desiredCamPos, desiredQuat, 0.9, 0.12);
    if (eMag < 1e-3) break;
  }
  const targetQ = getJointValues();
  setJointValues(startQ);

  // animate from start to target
  mode = 'snap';
  setStatus('Snapping…', 'snap');
  startBtn.disabled = true; stopBtn.disabled = true;
  snapBtn.disabled  = true; resetBtn.disabled = true;
  lockSliders(true);
  const dur = 800, t0 = performance.now();
  function frame(t){
    const u = clamp((t - t0)/dur, 0, 1);
    const eu = u<0.5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;
    for (let i=0;i<7;i++) setJoint(i, startQ[i] + (targetQ[i]-startQ[i])*eu);
    syncSlidersFromRobot();
    if (u < 1) requestAnimationFrame(frame);
    else {
      mode = 'idle';
      setStatus('At desired pose', 'converged');
      startBtn.disabled = false; stopBtn.disabled = true;
      snapBtn.disabled  = false; resetBtn.disabled = false;
      lockSliders(false);
      toast('Camera now facing the desired image', 'good');
    }
  }
  requestAnimationFrame(frame);
}

function resetJoints(){
  if (mode === 'ibvs' || mode === 'snap') return;
  robot.joints.forEach((j,i)=> setJoint(i, j.home));
  syncSlidersFromRobot();
  resetChart();
  setStatus('Idle');
  toast('Joints reset to home');
}

startBtn.addEventListener('click', startIBVS);
stopBtn .addEventListener('click', ()=>stopIBVS('Stopped'));
snapBtn .addEventListener('click', snapToDesired);
resetBtn.addEventListener('click', resetJoints);

/* ---- main loop ---- */
function tick(){
  requestAnimationFrame(tick);

  // resize main view to fit panel
  const pw = mainCanvas.clientWidth, ph = mainCanvas.clientHeight;
  if (mainCanvas.width !== pw || mainCanvas.height !== ph){
    renderer.setSize(pw, ph, false);
    mainCamera.aspect = pw/ph;
    mainCamera.updateProjectionMatrix();
  }

  // IK steps if in IBVS mode
  if (mode === 'ibvs'){
    for (let k=0;k<2;k++) ikStep(desiredCamPos, desiredQuat, 0.55, 0.05);
    iter++;
    syncSlidersFromRobot();
  }

  // render scene from both cameras
  robot.root.updateMatrixWorld(true);
  renderer.render(scene, mainCamera);
  camRenderer.render(scene, eeCamera);

  // similarity (after rendering current view)
  const sim = similarity();
  const pct = (sim*100).toFixed(1);
  simFill.style.width = (sim*100).toFixed(1) + '%';
  simText.textContent = pct + '%';

  if (mode === 'ibvs'){
    pushError(1 - sim);
    iterText.textContent = 'it ' + iter;
    if (sim >= STOP_THRESH){
      mode = 'idle';
      startBtn.disabled = false; stopBtn.disabled = true;
      snapBtn.disabled  = false; resetBtn.disabled = false;
      lockSliders(false);
      setStatus(`Converged (${pct}%)`, 'converged');
      toast(`IBVS converged at ${pct}% — simulation stopped`, 'good');
    }
  }
}

/* ============================================================
   Init
   ============================================================ */
function init(){
  refreshDesiredGray();
  setStatus('Idle');
  // size main canvas
  const pw = mainCanvas.clientWidth || 800, ph = mainCanvas.clientHeight || 500;
  renderer.setSize(pw, ph, false);
  mainCamera.aspect = pw/ph; mainCamera.updateProjectionMatrix();
  tick();
  toast('Ready — drag-upload a target or press Start IBVS', '');
}
init();

/* simple orbit-ish controls for the main camera */
let dragging=false, lastX=0, lastY=0;
const target = new THREE.Vector3(0.6, 0.7, 0);
let camYaw = Math.atan2(mainCamera.position.x - target.x, mainCamera.position.z - target.z);
let camPitch = Math.asin((mainCamera.position.y - target.y) /
                mainCamera.position.distanceTo(target));
let camDist = mainCamera.position.distanceTo(target);

function applyCam(){
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const cy = Math.cos(camYaw), sy = Math.sin(camYaw);
  mainCamera.position.set(
    target.x + camDist*cp*sy,
    target.y + camDist*sp,
    target.z + camDist*cp*cy
  );
  mainCamera.lookAt(target);
}
mainCanvas.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup', ()=>{ dragging=false; });
window.addEventListener('mousemove', e=>{
  if (!dragging) return;
  camYaw   -= (e.clientX-lastX)*0.005;
  camPitch  = clamp(camPitch + (e.clientY-lastY)*0.005, -1.2, 1.2);
  lastX=e.clientX; lastY=e.clientY; applyCam();
});
mainCanvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camDist = clamp(camDist * (1 + e.deltaY*0.0012), 1.2, 8);
  applyCam();
}, { passive:false });
applyCam();
</script>
